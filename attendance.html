<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance — EduPulse AI</title><link rel="icon" type="image/png" href="src/assets/brand/edupulse-icon-v2.png"><link rel="stylesheet" href="src/css/tracking.css"></head><body><main class="dashboard shell"><header class="dash-header"><a class="brand" href="dashboard.html"><img class="brand-mark" src="src/assets/brand/edupulse-icon-v2.png" alt="">EduPulse AI</a><nav style="display:none"><a id="back-course" class="button secondary" href="courses.html">Course</a><button class="button secondary" data-logout>Sign out</button></nav></header><section class="course-hero"><div><div class="eyebrow">Attendance tracking</div><h1 id="course-name">Course</h1><p class="muted">Present and late count as attended. Excused sessions are excluded from the denominator.</p></div><aside class="performance-card card"><span>Attendance rate</span><strong id="attendance-rate">—</strong><small id="attendance-count" class="muted"></small></aside></section><div class="section-bar"><h2>Session history</h2><button id="add-attendance" class="button" type="button">Record session</button></div><section id="attendance-list" class="history-list"></section></main><dialog id="attendance-dialog" class="modal"><div class="modal-inner"><div class="modal-head"><h2 id="attendance-dialog-title">Record attendance</h2><button id="close-attendance-dialog" class="icon-button" type="button">×</button></div><p id="form-message" class="message" hidden></p><form id="attendance-form"><input name="attendance_id" type="hidden"><div class="form-grid"><div class="field"><label for="session-date">Session date</label><input id="session-date" name="session_date" type="date" required></div><div class="field"><label for="attendance-status">Status</label><select id="attendance-status" name="status"><option value="present">Present</option><option value="late">Late</option><option value="absent">Absent</option><option value="excused">Excused</option></select></div><div class="field span-2"><label for="session-label">Session label</label><input id="session-label" name="session_label" maxlength="120" placeholder="Morning lecture"></div><div class="field span-2"><label for="attendance-notes">Notes</label><input id="attendance-notes" name="notes" maxlength="500"></div></div><div class="modal-actions"><button class="button" type="submit">Save session</button></div></form></div></dialog><script type="module" src="src/js/pages/attendance.js"></script></body></html>
