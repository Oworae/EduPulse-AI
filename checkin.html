<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly check-in — EduPulse AI</title><link rel="icon" type="image/png" href="src/assets/brand/edupulse-icon-v2.png"><link rel="stylesheet" href="src/css/tracking.css?v=20260812-nav"></head><body><main class="dashboard shell"><header class="dash-header"><a class="brand" href="dashboard.html"><img class="brand-mark" src="src/assets/brand/edupulse-icon-v2.png" alt="">EduPulse AI</a></header><section class="checkin-head"><div class="eyebrow">Weekly reflection</div><h1>How did this week feel?</h1><p id="week-label" class="semester-chip"></p></section><section class="checkin-layout"><form id="checkin-form" class="checkin-card card form-grid"><input name="week_start" type="hidden"><div class="field"><label for="study-hours">Study hours</label><input id="study-hours" name="study_hours" type="number" min="0" max="168" step="0.25" required></div><div class="field"><label for="scheduled">Classes scheduled</label><input id="scheduled" name="classes_scheduled" type="number" min="0" max="100" required></div><div class="field"><label for="attended">Classes attended</label><input id="attended" name="classes_attended" type="number" min="0" max="100" required></div><div class="field"><label for="workload">Workload</label><select id="workload" name="workload"><option value="1">1 — Very light</option><option value="2">2 — Light</option><option value="3" selected>3 — Manageable</option><option value="4">4 — Heavy</option><option value="5">5 — Overwhelming</option></select></div><div class="field"><label for="confidence">Academic confidence</label><input id="confidence" name="confidence" type="range" min="1" max="5" value="3"></div><div class="field"><label for="focus">Focus</label><input id="focus" name="focus" type="range" min="1" max="5" value="3"></div><div class="field span-2"><label for="reflection">Reflection</label><textarea id="reflection" name="reflection" rows="5" maxlength="2000" placeholder="What went well? What got in the way?"></textarea></div><p id="form-message" class="message span-2" hidden></p><div class="form-actions"><button class="button" type="submit">Save weekly check-in</button></div></form><aside><h2>Recent check-ins</h2><div id="checkin-history" class="history-list"></div></aside></section></main><script type="module" src="src/js/pages/checkin.js?v=20260812-nav"></script></body></html>
