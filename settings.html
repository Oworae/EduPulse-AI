<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — EduPulse AI</title><link rel="icon" type="image/png" href="src/assets/brand/edupulse-icon-v2.png"><link rel="stylesheet" href="src/css/settings.css?v=20260812-nav"></head><body><main class="dashboard shell"><header class="dash-header"><a class="brand" href="dashboard.html"><img class="brand-mark" src="src/assets/brand/edupulse-icon-v2.png" alt="">EduPulse AI</a></header><section class="page-head"><div><div class="eyebrow">Personal workspace</div><h1>Settings</h1><p class="muted">Update your academic identity and review your grading configuration.</p></div></section><section class="settings-grid"><form id="settings-form" class="settings-card card form-grid"><div class="section-title"><h2>Academic profile</h2></div><div class="field span-2"><label>Full name</label><input name="full_name" required></div><div class="field"><label>Institution</label><input name="institution_name"></div><div class="field"><label>Programme</label><input name="programme"></div><div class="field"><label>Level</label><input name="level" type="number" min="1" max="1000"></div><div class="field"><label>Timezone</label><input name="timezone"></div><p id="form-message" class="message span-2" hidden></p><div class="form-actions"><button class="button">Save profile</button></div></form><aside class="settings-card card"><h2>Grading scales</h2><p class="muted">Current available scales and grade bands.</p><div id="grading-scales" class="scale-list"></div></aside></section></main><script type="module" src="src/js/pages/settings.js?v=20260812-nav"></script></body></html>
