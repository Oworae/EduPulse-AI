<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Courses — EduPulse AI</title><link rel="icon" type="image/png" href="src/assets/brand/edupulse-icon-v2.png"><link rel="stylesheet" href="src/css/courses.css?v=20260812-nav"></head><body><main class="dashboard shell"><header class="dash-header"><a class="brand" href="dashboard.html"><img class="brand-mark" src="src/assets/brand/edupulse-icon-v2.png" alt="">EduPulse AI</a></header><section class="page-head"><div><div class="eyebrow">Course workspace</div><h1>Your courses</h1><p><span id="semester-label" class="semester-chip"></span> · <span id="course-total" class="muted"></span></p></div><button id="add-course" class="button" type="button">Add course</button></section><section id="course-list" class="course-grid" aria-live="polite"></section></main><dialog id="course-dialog" class="modal"><div class="modal-inner"><div class="modal-head"><h2 id="course-dialog-title">Add a course</h2><button id="close-course-dialog" class="icon-button" type="button" aria-label="Close">×</button></div><p id="form-message" class="message" hidden aria-live="polite"></p><form id="course-form"><input name="course_id" type="hidden"><div class="form-grid"><div class="field"><label for="course-code-input">Course code</label><input id="course-code-input" name="course_code" maxlength="30" placeholder="STAT 201" required></div><div class="field"><label for="credits">Credit hours</label><input id="credits" name="credit_hours" type="number" min="0.5" max="99" step="0.5" value="3" required></div><div class="field span-2"><label for="course-name-input">Course name</label><input id="course-name-input" name="course_name" maxlength="160" placeholder="Applied Statistics" required></div><div class="field span-2"><label for="target">Target percentage</label><input id="target" name="target_percentage" type="number" min="0" max="100" step="0.01" placeholder="75"></div></div><di
