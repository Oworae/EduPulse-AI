<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semesters — EduPulse AI</title><link rel="stylesheet" href="src/css/settings.css"></head><body><main class="dashboard shell"><header class="dash-header"><a class="brand" href="dashboard.html"><span class="brand-mark">E</span>EduPulse AI</a><nav><a class="button secondary" href="settings.html">Settings</a><a class="button secondary" href="dashboard.html">Dashboard</a><button class="button secondary" data-logout>Sign out</button></nav></header><section class="page-head"><div><div class="eyebrow">Academic history</div><h1>Your semesters</h1><p class="muted">Keep every academic period separate so trends remain meaningful.</p></div><button id="add-semester" class="button">Create semester</button></section><section id="semester-list" class="semester-list"></section></main><dialog id="semester-dialog" class="modal"><div class="modal-inner"><div class="modal-head"><h2 id="semester-dialog-title">Create semester</h2><button id="close-semester-dialog" class="icon-button">×</button></div><p id="form-message" class="message" hidden></p><form id="semester-form"><div class="form-grid"><div class="field"><label>Academic year</label><input name="academic_year" placeholder="2026/2027" required></div><div class="field"><label>Semester name</label><input name="semester_name" placeholder="Semester 2" required></div><div class="field span-2"><label>Grading scale</label><select name="grading_scale_id" required></select></div><div class="field"><label>Start date</label><input name="start_date" type="date"></div><div class="field"><label>End date</label><input name="end_date" type="date"></div><div class="field"><label>Target average</label><input name="target_average" type="number" min="0" max="100" step=".01"></div><div class="field"><label>Target GPA</label><input name="target_gpa" type="number" min="0" step=".01"></div></div><div class="modal-actions"><button class="button" type="submit">Create and activate</button></div></form></div></dialog><script type="module" src="src/js/pages/semesters.js"></script></body></html>
