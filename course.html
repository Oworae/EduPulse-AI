<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course — EduPulse AI</title><link rel="stylesheet" href="src/css/courses.css"></head><body><main class="dashboard shell"><header class="dash-header"><a class="brand" href="dashboard.html"><span class="brand-mark">E</span>EduPulse AI</a><nav><a class="button secondary" href="courses.html">All courses</a><button class="button secondary" data-logout>Sign out</button></nav></header><section class="course-hero"><div><div id="course-code" class="eyebrow"></div><h1 id="course-name">Course</h1><p id="course-meta" class="muted"></p></div><aside class="performance-card card"><span>Current performance</span><strong id="performance">—</strong><small id="completed-weight" class="muted"></small></aside></section><div class="section-bar"><div><h2>Assessments</h2><p class="muted">Planned work is never counted as zero.</p></div><div class="section-actions"><a id="attendance-link" class="button secondary" href="#">Attendance</a><button id="add-assessment" class="button" type="button">Add assessment</button></div></div><section id="assessment-list" class="assessment-list" aria-live="polite"></section></main><dialog id="assessment-dialog" class="modal"><div class="modal-inner"><div class="modal-head"><h2 id="assessment-dialog-title">Add assessment</h2><button id="close-assessment-dialog" class="icon-button" type="button" aria-label="Close">×</button></div><p id="form-message" class="message" hidden aria-live="polite"></p><form id="assessment-form"><input name="assessment_id" type="hidden"><div class="form-grid"><div class="field span-2"><label for="assessment-title">Title</label><input id="assessment-title" name="title" maxlength="160" required></div><div class="field"><label for="assessment-type">Type</label><select id="assessment-type" name="assessment_type"><option value="quiz">Quiz</option><option value="assignment">Assignment</option><option value="midsem">Mid-semester exam</option><option value="project">Project</option><option value="presentation">Presentation</option><option value="practical">Practical</option><option value="final_exam">Final exam</option><option value="other">Other</option></select></div><div class="field"><label for="assessment-status">Status</label><select id="assessment-status" name="status"><option value="planned">Planned</option><option value="completed">Completed</option></select></div><div class="field"><label for="weight">Weight (%)</label><input id="weight" name="weight_percentage" type="number" min="0.01" max="100" step="0.01" required></div><div class="field"><label for="scheduled-date">Scheduled date</label><input id="scheduled-date" name="scheduled_date" type="date"></div><div id="score-fields" class="span-2 form-grid" hidden><div class="field"><label for="score">Score</label><input id="score" name="score" type="number" min="0" step="0.01"></div><div class="field"><label for="max-score">Maximum score</label><input id="max-score" name="max_score" type="number" min="0.01" step="0.01"></div><div class="field span-2"><label for="completed-date">Completed date</label><input id="completed-date" name="completed_date" type="date"></div></div></div><div class="modal-actions"><button class="button" type="submit">Save assessment</button></div></form></div></dialog><script type="module">const id=new URLSearchParams(location.search).get("id");document.querySelector("#attendance-link").href=`attendance.html?id=${encodeURIComponent(id??"")}`;</script><script type="module" src="src/js/pages/course-detail.js"></script></body></html>
